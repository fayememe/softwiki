x-api-common: &api-common
  build:
    context: .
    target: api
  image: softwiki-api:${TAG:-latest}
  env_file:
    - ${SOFTWIKI_ENV_FILE:-.env}
  environment:
    # Each stack gets its own workspaces root containing only the kbs it
    # serves. Mounting the shared parent (the old behaviour) let every stack
    # read every other stack's documents, exports and indexes — the databases
    # were separated but the files were not.
    WORKSPACES_ROOT: /data/workspaces
    WORKSPACE_DIR: /data/workspaces/${SOFTWIKI_ACTIVE_WORKSPACE:-lsl-kb}
    SOFTWIKI_ENABLE_WEB_SEARCH: "true"
    AGENT_WEB_URL: ${AGENT_WEB_URL:-http://host.docker.internal:6111}
    AGENT_DEFAULT: ${AGENT_DEFAULT:-wiki-research}
    WIKI_REBUILD_WORKER: "1"
    SOFTWIKI_ROLE: ${SOFTWIKI_ROLE:-wiki-study}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    # Stack-private root: only this stack's kbs live here.
    - ${SOFTWIKI_STACK_ROOT:-./workspace/stacks/default}:/data/workspaces
    # Shared across stacks on purpose: identity and audit are instance-level,
    # not kb-level. Neither contains kb content.
    - ${SOFTWIKI_SHARED_CONFIG:-./workspace/config}:/data/workspaces/config
    - ${SOFTWIKI_AUDIT_DIR:-./workspace/.softwiki-audit}:/data/workspaces/.softwiki-audit
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: softwiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-softwiki}
      POSTGRES_DB: ${POSTGRES_DB:-softwiki_kb_alpha}
    volumes:
      - softwiki_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U softwiki -d ${POSTGRES_DB:-softwiki_kb_alpha}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    <<: *api-common
    command: ["python", "-m", "softwiki.cli.main", "api", "--host", "0.0.0.0", "--port", "6200"]
    ports:
      - "${API_HOST_PORT:-6300}:6200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6200/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  mcp:
    <<: *api-common
    command: ["python", "-m", "softwiki.cli.main", "mcp", "--host", "0.0.0.0", "--port", "6100", "--transport", "both"]
    ports:
      - "${MCP_HOST_PORT:-6301}:6100"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 6100), 3).close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    build:
      context: .
      target: web
      args:
        API_INTERNAL_URL: http://api:6200
    image: softwiki-web:${TAG:-latest}
    environment:
      API_INTERNAL_URL: http://api:6200
      # Which page /wikiweb opens. Per-kb so a portal never links to another kb.
      WIKIWEB_ENTRY: ${WIKIWEB_ENTRY:-index.html}
    ports:
      - "${WEB_HOST_PORT:-6308}:6108"
    volumes:
      # Static wiki portal for *this* kb: lives in the workspace with the data,
      # mounted read-only into public/ so Next serves /wikiweb/*.
      # Generated artifact — see docs/03-operations/deployment-trial.md.
      - ${WIKIWEB_DIR:-./workspace/lsl-kb/exports/wikiweb}:/app/public/wikiweb:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6108').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  softwiki_pg:
