# Lightweight auth demo: Authelia (forward-auth) + nginx + softwiki in proxy mode.
#
# No database, no external IdP: Authelia reads users from a YAML file, so the
# whole chain runs in three small containers. This is an *example*, not a
# production blueprint — swap Authelia for the customer's own IdP.
#
#   ./setup.sh          # generate secrets + user hashes, then start
#   open http://localhost:6190
#
# Only nginx is published. The API and Authelia are reachable solely on the
# internal network, which is what makes trusting the headers safe.

services:
  authelia:
    image: authelia/authelia:4.38
    # Run as the invoking user so the YAML/SQLite it writes stay editable
    # instead of turning into root-owned files.
    user: "${DEMO_UID:-1000}:${DEMO_GID:-1000}"
    volumes:
      - ./authelia:/config
    networks:
      - authnet
    restart: unless-stopped

  # Private database for the demo: two knowledge bases copied from production,
  # never the live ones. Same layout as a real multi-kb instance.
  db:
    image: ${DEMO_PG_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: softwiki
      POSTGRES_PASSWORD: ${DEMO_PG_PASSWORD:-demo-only-password}
      POSTGRES_DB: postgres
    networks:
      - authnet
    volumes:
      - demo_pg:/var/lib/postgresql/data
    restart: unless-stopped

  softwiki:
    image: ${SOFTWIKI_IMAGE:-softwiki-api:auth-demo}
    command: ["python", "-m", "softwiki.cli.main", "api", "--host", "0.0.0.0", "--port", "6200"]
    # Only the LLM keys, so the demo can extract claims without inheriting the
    # production .env (which would also point DATABASE_URL at a foreign host).
    # Generated by setup.sh; gitignored.
    env_file:
      - path: .env.llm
        required: false
    environment:
      # Identity comes from the proxy; we never implement the protocol.
      SOFTWIKI_AUTH_MODE: proxy
      # Only this network is believed. nginx lives here; the outside does not.
      SOFTWIKI_TRUSTED_PROXIES: 172.31.240.0/24
      SOFTWIKI_PROXY_USER_HEADER: X-Auth-Request-User
      SOFTWIKI_PROXY_GROUPS_HEADER: X-Auth-Request-Groups
      SOFTWIKI_PROXY_EMAIL_HEADER: X-Auth-Request-Email
      SOFTWIKI_PROXY_NAME_HEADER: X-Auth-Request-Name
      SOFTWIKI_PROXY_ISSUER_LABEL: demo
      WORKSPACES_ROOT: /data/workspaces
      WORKSPACE_DIR: /data/workspaces/${DEMO_START_KB:-coffee}
      # One database per kb, exactly like a real deployment.
      DATABASE_URL_TEMPLATE: postgresql+psycopg2://softwiki:${DEMO_PG_PASSWORD:-demo-only-password}@db:5432/softwiki_{workspace}
      SOFTWIKI_ALLOW_MOCK_EMBEDDINGS: "1"
      SOFTWIKI_DISABLE_LIGHTRAG: "1"
      SOFTWIKI_ENABLE_WEB_SEARCH: "0"
      SOFTWIKI_ROLE: wiki-study
    volumes:
      # Read-only views of two real knowledge bases. The demo must never write
      # to them; a copy of their databases lives in the private `db` service.
      - ./workspaces/coffee:/data/workspaces/coffee
      - ./workspaces/ai-history:/data/workspaces/ai-history
      - ./workspaces/config:/data/workspaces/config
    networks:
      authnet:
        # The web image bakes its rewrite target at build time (http://api:6200).
        # Aliasing keeps that target resolvable without rebuilding the image.
        aliases:
          - api
    restart: unless-stopped

  # The actual UI. nginx talks to this instead of the API so the demo shows
  # the product, not raw JSON. Identity headers survive the Next.js rewrite.
  web:
    image: ${DEMO_WEB_IMAGE:-softwiki-web:latest}
    environment:
      API_INTERNAL_URL: http://softwiki:6200
    networks:
      - authnet
    restart: unless-stopped

  nginx:
    image: ${DEMO_NGINX_IMAGE:-nginx:1.27-alpine}
    environment:
      # Only DEMO_* placeholders are substituted; nginx's own $vars survive.
      NGINX_ENVSUBST_FILTER: "^DEMO_"
      DEMO_APP_PORT: ${DEMO_APP_PORT:-6190}
      DEMO_PORTAL_PORT: ${DEMO_PORTAL_PORT:-6191}
      DEMO_BIND_ADDR: ${DEMO_BIND_ADDR:-0.0.0.0}
    volumes:
      - ./nginx:/etc/nginx/templates:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "${DEMO_BIND_ADDR:-0.0.0.0}:${DEMO_APP_PORT:-6190}:${DEMO_APP_PORT:-6190}"
      - "${DEMO_BIND_ADDR:-0.0.0.0}:${DEMO_PORTAL_PORT:-6191}:${DEMO_PORTAL_PORT:-6191}"
    networks:
      - authnet
    depends_on:
      - authelia
      - softwiki
      - web
    restart: unless-stopped

networks:
  authnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.240.0/24

volumes:
  demo_pg:
